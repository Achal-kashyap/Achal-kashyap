<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contributions · Achal-kashyap</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d12;--card:#131820;--line:#1e2530;--tx:#e6edf3;--mut:#8b96a5;--l0:#161b22;--l1:#0e4429;--l2:#006d32;--l3:#26a641;--l4:#39d353}
*{box-sizing:border-box}
body{margin:0;background:#05070a;font-family:Roboto,system-ui,sans-serif;color:var(--tx);display:flex;justify-content:center;padding:24px}
.panel{width:100%;max-width:1000px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:28px 28px 20px}
.head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:18px;font-weight:700}
.meta{font:12px/1 "Roboto Mono",monospace;color:var(--mut);letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 8px}
.stat{background:var(--card);border-radius:10px;padding:16px 18px}
.stat .t{color:var(--mut);font-size:15px}
.stat .v{font-size:34px;font-weight:700;margin:8px 0 4px}
.stat .v small{font-size:17px;font-weight:400;color:var(--mut)}
.stat .s{font:12px "Roboto Mono",monospace;color:var(--mut);letter-spacing:.05em}
svg{width:100%;height:auto;display:block;overflow:visible}
.plane{fill:#12171e}
.mon{font:12px "Roboto Mono",monospace;fill:#aab3bf}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*7ms);cursor:pointer;transition:filter .15s,translate .15s}
.bar:hover{filter:brightness(1.45) drop-shadow(0 0 6px #39d35399);translate:0 -5px}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.foot{display:flex;justify-content:space-between;align-items:center;font:12px "Roboto Mono",monospace;color:var(--mut);margin-top:6px;flex-wrap:wrap;gap:8px}
.leg{display:flex;align-items:center;gap:5px}.leg i{width:13px;height:13px;border-radius:3px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:#1b222c;border:1px solid #2c3644;border-radius:8px;padding:8px 11px;font-size:13px;opacity:0;transition:opacity .12s;z-index:9;white-space:nowrap;box-shadow:0 6px 20px #0008}
#tip b{color:var(--l4)}
@media(max-width:700px){.stats{grid-template-columns:1fr}.stat .v{font-size:28px}}
@media(prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
</head>
<body>
<div class="panel">
  <div class="head"><h1>Contributions</h1><div class="meta">PAST 12 MONTHS · STREAKS OVER ALL YEARS · PUBLIC ONLY</div></div>
  <div class="stats">
    <div class="stat"><div class="t">Current streak</div><div class="v"><span id="cs">0</span> <small>day</small></div><div class="s" id="csd">–</div></div>
    <div class="stat"><div class="t">Longest streak</div><div class="v"><span id="ls">0</span> <small>days</small></div><div class="s" id="lsd">–</div></div>
    <div class="stat"><div class="t">Contributions (past 12 months)</div><div class="v"><span id="tot">0</span></div><div class="s" id="avg">–</div></div>
  </div>
  <svg id="g" viewBox="0 0 900 400" role="img" aria-label="3D contribution graph"></svg>
  <div class="foot">
    <div class="leg">Less <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> More</div>
    <div id="ref">REFRESHED –</div>
  </div>
</div>
<div id="tip"></div>
<script>
const USER = "Achal-kashyap";
const A = [14, 5.2], B = [-10, 5.4], O = [95, 70], S = 0.78;
const COL = [["#1a2028","#11161c","#0d1217"],["#14623a","#0b4a2a","#083a21"],["#0f8a43","#066a32","#04532a"],["#2fb350","#1e8a3c","#16702f"],["#4be06a","#2fb350","#228f3e"]];
const NS = "http://www.w3.org/2000/svg";
const P = (w, d, h = 0) => [O[0] + w * A[0] + d * B[0], O[1] + w * A[1] + d * B[1] - h];
const pts = a => a.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
const el = (n, at, par) => { const e = document.createElementNS(NS, n); for (const k in at) e.setAttribute(k, at[k]); par && par.appendChild(e); return e; };
const iso = d => d.toISOString().slice(0, 10);
const fmt = (s, o) => new Date(s + "T00:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", ...o });

async function load() {
  try {
    const r = await fetch(`https://github-contributions-api.jogruber.de/v4/${USER}?y=all`);
    if (!r.ok) throw 0;
    const j = await r.json();
    return j.contributions;
  } catch (e) {
    // fallback demo data (API not reachable)
    const out = [], t = new Date();
    for (let i = 900; i >= 0; i--) { const d = new Date(t - i * 864e5); const c = Math.random() < .35 ? Math.floor(Math.random() * 8) : 0; out.push({ date: iso(d), count: c }); }
    return out;
  }
}
const lvl = (c, m) => c === 0 ? 0 : Math.min(4, Math.ceil(c / m * 4));
const countUp = (id, to) => { const e = document.getElementById(id), t0 = performance.now(); (function f(t) { const k = Math.min(1, (t - t0) / 1000); e.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0); };

load().then(all => {
  const map = new Map(all.map(c => [c.date, c.count]));
  const today = new Date(); today.setUTCHours(0, 0, 0, 0);
  const todayS = iso(today);

  // streaks (all years)
  let cur = 0, curEnd = null, best = 0, bs = null, be = null, run = 0, rs = null;
  const days = all.filter(c => c.date <= todayS);
  days.forEach(c => { if (c.count > 0) { if (!run) rs = c.date; run++; if (run > best) { best = run; bs = rs; be = c.date; } } else run = 0; });
  let i = days.length - 1; if (days[i] && days[i].count === 0) i--;
  if (i >= 0) { curEnd = days[i].date; while (i >= 0 && days[i].count > 0) { cur++; i--; } }
  const o = { month: "short", day: "numeric" };
  document.getElementById("csd").textContent = cur ? fmt(curEnd, { ...o, year: "numeric" }).toUpperCase() : "NO ACTIVE STREAK";
  document.getElementById("lsd").textContent = best ? `${fmt(bs, o)} — ${fmt(be, { ...o, year: "numeric" })}`.toUpperCase() : "–";

  // last 53 weeks
  const start = new Date(today); start.setUTCDate(start.getUTCDate() - 364); start.setUTCDate(start.getUTCDate() - start.getUTCDay());
  const cells = []; let total = 0, peak = 0;
  for (let w = 0; w < 53; w++) for (let d = 0; d < 7; d++) {
    const dt = new Date(start); dt.setUTCDate(start.getUTCDate() + w * 7 + d); const s = iso(dt);
    if (s > todayS) continue;
    const c = map.get(s) || 0; total += c; peak = Math.max(peak, c); cells.push({ w, d, s, c });
  }
  countUp("cs", cur); countUp("ls", best); countUp("tot", total);
  document.getElementById("avg").textContent = `AVG ${(total / 365).toFixed(1)} / DAY · PEAK ${peak}`;
  document.getElementById("ref").textContent = "REFRESHED " + new Date().toISOString().slice(0, 16).replace("T", " ") + " UTC";

  const svg = document.getElementById("g");
  el("polygon", { class: "plane", points: pts([P(-.7, -.7), P(53.2, -.7), P(53.2, 7.1), P(-.7, 7.1)]) }, svg);

  // month labels along near edge
  let lastM = -1;
  for (let w = 0; w < 53; w++) {
    const dt = new Date(start); dt.setUTCDate(start.getUTCDate() + w * 7);
    if (dt.getUTCMonth() !== lastM) {
      lastM = dt.getUTCMonth(); const p = P(w, 8.6);
      const t = el("text", { class: "mon", x: p[0], y: p[1] }, svg); t.textContent = dt.toLocaleString("en-US", { month: "short", timeZone: "UTC" });
    }
  }

  const tip = document.getElementById("tip");
  cells.sort((a, b) => (a.w * A[1] + a.d * B[1]) - (b.w * A[1] + b.d * B[1]) || a.w - b.w);
  cells.forEach((c, idx) => {
    const L = lvl(c.c, peak), h = c.c ? 6 + Math.sqrt(c.c / peak) * 62 : 2, k = COL[L];
    const g = el("g", { class: "bar", style: `--i:${c.w * 7 + c.d > 0 ? c.w * 7 + c.d : 0}` }, svg);
    const p0 = P(c.w, c.d), p1 = P(c.w + S, c.d), p2 = P(c.w + S, c.d + S), p3 = P(c.w, c.d + S);
    const up = p => [p[0], p[1] - h];
    el("polygon", { points: pts([p3, p2, up(p2), up(p3)]), fill: k[1] }, g);
    el("polygon", { points: pts([p1, p2, up(p2), up(p1)]), fill: k[2] }, g);
    el("polygon", { points: pts([up(p0), up(p1), up(p2), up(p3)]), fill: k[0] }, g);
    g.addEventListener("mousemove", e => {
      tip.innerHTML = `<b>${c.c} contribution${c.c === 1 ? "" : "s"}</b> on ${fmt(c.s, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}`;
      tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = (e.clientY - 44) + "px";
    });
    g.addEventListener("mouseleave", () => tip.style.opacity = 0);
  });
});
</script>
</body>
</html>
