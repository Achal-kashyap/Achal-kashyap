
name: Generate GitHub Streak

on:
  schedule:
    - cron: "30 4 * * *"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "scripts/generate-streak.js"
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate Streak SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/generate-streak.js

      - name: Commit Streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak.svg

          if git diff --cached --quiet; then
            echo "No changes found"
          else
            git commit -m "Update GitHub streak"
            git push origin main
          fi
