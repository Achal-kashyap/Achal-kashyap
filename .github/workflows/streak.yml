
name: Update GitHub Streak

on:
  schedule:
    - cron: "30 4 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/generate-streak.js"
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate streak
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/generate-streak.js

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || git commit -m "Update GitHub streak stats"
          git push
