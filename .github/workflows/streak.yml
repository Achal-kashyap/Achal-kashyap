
name: Update GitHub Streak

on:
  schedule:
    - cron: "30 4 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/generate-streak.js"
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate GitHub Streak
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/generate-streak.js

      - name: Save updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak.svg

          if git diff --cached --quiet; then
            echo "SVG is already up to date."
          else
            git commit -m "Update GitHub streak stats"
            git push
          fi
