<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" fill="none">
<style>
  .pulse { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
  .sweep { stroke-dasharray: 80 240; animation: trace 8s linear infinite; }
  @keyframes trace { to { stroke-dashoffset: -640 } }
  .scan { animation: scan 4s ease-in-out infinite; }
  @keyframes scan { 0%,100% { transform: translateY(0); opacity: .2 } 50% { transform: translateY(150px); opacity: .8 } }
</style>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F2C76E"/>
    <stop offset="50%" stop-color="#7FC8FF"/>
    <stop offset="100%" stop-color="#8E9BFF"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F2C76E"/>
    <stop offset="100%" stop-color="#FFE3A3"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" stroke="#7FC8FF" stroke-opacity="0.06"/>
  </pattern>
</defs>

<rect x="1" y="1" width="1098" height="258" rx="20" fill="#0A111F"/>
<rect x="1" y="1" width="1098" height="258" rx="20" fill="url(#grid)"/>
<rect x="1" y="1" width="1098" height="258" rx="20" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="10" y="10" width="1080" height="240" rx="14" stroke="url(#edge)" stroke-width="1.2" class="sweep" stroke-linecap="round"/>

<!-- badge -->
<rect x="44" y="40" width="150" height="180" rx="20" fill="#0E1730" stroke="#F2C76E" stroke-opacity=".6"/>
<text x="119" y="140" text-anchor="middle" fill="url(#gold)" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800">AK</text>
<rect class="scan" x="56" y="56" width="126" height="2" fill="#7FC8FF"/>
<text x="119" y="200" text-anchor="middle" fill="#AEB8D0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">ID · 001</text>

<!-- heading -->
<text x="230" y="64" fill="#AEB8D0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="3">DEVELOPER IDENTITY CARD</text>
<text x="230" y="108" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="800">Achal Kashyap</text>
<rect x="230" y="120" width="100" height="3" rx="1.5" fill="url(#gold)"/>

<!-- fields -->
<text x="230" y="158" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">ROLE</text>
<text x="230" y="182" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Computer Science Student</text>

<text x="520" y="158" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">GITHUB</text>
<text x="520" y="182" fill="#F4F1EA" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="600">Achal-kashyap</text>

<text x="790" y="158" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">BASED IN</text>
<text x="790" y="182" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">India</text>

<text x="230" y="216" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">FOCUS</text>
<text x="300" y="216" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">AI · Machine Learning · Web</text>

<text x="620" y="216" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">STATUS</text>
<text class="pulse" x="690" y="216" fill="#9BE7C4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Learning · Building · Improving</text>
</svg>
