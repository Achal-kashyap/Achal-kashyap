<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" fill="none">
<style>
  .glow-a { animation: breathe 8s ease-in-out infinite; }
  .glow-b { animation: breathe 10s ease-in-out infinite reverse; }
  @keyframes breathe { 0%,100% { opacity: .25 } 50% { opacity: .6 } }
  .blink { animation: blink 1.4s steps(1,end) infinite; }
  @keyframes blink { 0%,55% { opacity: 1 } 60%,100% { opacity: 0 } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
  .spin-rev { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .orbit { offset-path: path("M900 50 A160 160 0 1 1 899.99 50"); animation: travel 9s linear infinite; }
  @keyframes travel { from { offset-distance: 0% } to { offset-distance: 100% } }
  .pill { animation: pillglow 3.6s ease-in-out infinite; }
  @keyframes pillglow { 0%,100% { stroke-opacity: .45 } 50% { stroke-opacity: 1 } }
  .status { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .7 } 50% { opacity: 1 } }
  .sweep { stroke-dasharray: 90 260; animation: trace 8s linear infinite; }
  @keyframes trace { to { stroke-dashoffset: -700 } }
</style>

<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F2C76E"/>
    <stop offset="50%" stop-color="#7FC8FF"/>
    <stop offset="100%" stop-color="#8E9BFF"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1B2A47"/>
    <stop offset="100%" stop-color="#0E1730"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F2C76E"/>
    <stop offset="100%" stop-color="#FFE3A3"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#7FC8FF" stroke-opacity="0.07" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="avatarClip"><rect x="800" y="110" width="200" height="200" rx="40"/></clipPath>
</defs>

<!-- background -->
<rect x="1" y="1" width="1098" height="448" rx="24" fill="#0A111F"/>
<rect x="1" y="1" width="1098" height="448" rx="24" fill="url(#grid)"/>
<ellipse class="glow-a" cx="930" cy="60" rx="260" ry="90" fill="#F2C76E" opacity="0.18" filter="url(#soft)"/>
<ellipse class="glow-b" cx="160" cy="420" rx="280" ry="80" fill="#3A5BFF" opacity="0.22" filter="url(#soft)"/>

<!-- borders -->
<rect x="1" y="1" width="1098" height="448" rx="24" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="14" y="14" width="1072" height="422" rx="16" stroke="url(#edge)" stroke-width="1.4" class="sweep" stroke-linecap="round"/>

<!-- header -->
<circle class="blink" cx="60" cy="46" r="4.5" fill="#F2C76E"/>
<text x="76" y="51" fill="#AEB8D0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">PROFILE // ONLINE</text>
<text x="1040" y="51" text-anchor="end" fill="#8E9BFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">v2.0</text>

<!-- name block -->
<text x="60" y="140" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">Achal Kashyap</text>
<rect x="60" y="154" width="120" height="4" rx="2" fill="url(#gold)"/>
<text x="60" y="190" fill="#7FC8FF" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Computer Science Student  ·  AI / ML  ·  Full-Stack</text>

<!-- info -->
<text x="60" y="236" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">LOCATION</text>
<text x="60" y="262" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">India</text>

<text x="260" y="236" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">GITHUB</text>
<text x="260" y="262" fill="#F4F1EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600">Achal-kashyap</text>

<text x="500" y="236" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">FOCUS</text>
<text x="500" y="262" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">AI · ML · Web</text>

<text x="60" y="312" fill="#F2C76E" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">STATUS</text>
<text class="status" x="60" y="338" fill="#9BE7C4" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Learning   ·   Building   ·   Improving</text>

<!-- avatar (right side) -->
<rect class="spin" x="786" y="96" width="228" height="228" rx="52" stroke="url(#edge)" stroke-width="2.4" stroke-dasharray="30 16 8 40" stroke-linecap="round"/>
<rect class="spin-rev" x="778" y="88" width="244" height="244" rx="58" stroke="#8E9BFF" stroke-width="1" stroke-dasharray="2 8" stroke-linecap="round"/>
<circle class="orbit" r="4" fill="#F2C76E" filter="url(#soft)"/>
<rect x="800" y="110" width="200" height="200" rx="40" fill="url(#card)"/>
<text x="900" y="232" text-anchor="middle" fill="url(#gold)" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="2">AK</text>
