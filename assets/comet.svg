<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="368" viewBox="0 0 1100 368" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .flow { stroke-dasharray: 9 18; animation: flow 2.8s linear infinite; }
  .flow-slow { stroke-dasharray: 14 22; animation: flow 7s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -108; } }
  .traveler { offset-path: path("M40 210 C 180 120, 280 250, 460 190 S 760 120, 1060 150"); animation: travel 9s linear infinite; }
  .traveler-b { offset-path: path("M40 250 C 220 180, 340 300, 540 230 S 820 300, 1060 200"); animation: travel 12s linear infinite; }
  @keyframes travel { from { offset-distance: 0% } to { offset-distance: 100% } }
  .glow-a { animation: breathe 8s ease-in-out infinite; }
  .glow-b { animation: breathe 10s ease-in-out infinite reverse; }
  @keyframes breathe { 0%,100% { opacity: .2 } 50% { opacity: .55 } }
  .live { transform-box: fill-box; transform-origin: center; animation: beat 2.2s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.5); opacity: .55 } }
  .pill { animation: pillglow 3.6s ease-in-out infinite; }
  @keyframes pillglow { 0%,100% { stroke-opacity: .45 } 50% { stroke-opacity: 1 } }
  .sweep { stroke-dasharray: 90 260; animation: trace 8s linear infinite; }
  @keyframes trace { to { stroke-dashoffset: -700 } }
  .node { transform-box: fill-box; transform-origin: center; animation: node 3s ease-in-out infinite; }
  @keyframes node { 0%,100% { transform: scale(1) } 50% { transform: scale(1.35) } }
</style>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F2C76E"/>
    <stop offset="50%" stop-color="#7FC8FF"/>
    <stop offset="100%" stop-color="#8E9BFF"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F2C76E"/>
    <stop offset="100%" stop-color="#FFE3A3"/>
  </linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7FC8FF" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#7FC8FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#7FC8FF" stroke-opacity="0.07"/>
  </pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>

<rect x="1" y="1" width="1098" height="366" rx="22" fill="#0A111F"/>
<rect x="1" y="1" width="1098" height="366" rx="22" fill="url(#grid)"/>
<ellipse class="glow-a" cx="930" cy="60" rx="240" ry="70" fill="#F2C76E" opacity=".2" filter="url(#blur)"/>
<ellipse class="glow-b" cx="160" cy="350" rx="260" ry="60" fill="#3A5BFF" opacity=".25" filter="url(#blur)"/>
<rect x="1" y="1" width="1098" height="366" rx="22" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="13" y="13" width="1074" height="342" rx="15" stroke="url(#edge)" stroke-width="1.3" class="sweep" stroke-linecap="round"/>

<!-- header -->
<circle class="live" cx="46" cy="46" r="4.5" fill="#F2C76E"/>
<text x="62" y="51" fill="#AEB8D0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">COMET GRAPH  //  LIVE</text>
<text x="1060" y="51" text-anchor="end" fill="#8E9BFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">v2.0</text>
<text x="40" y="98" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="800">Consistency  ·  Activity  ·  Growth  ·  Progress</text>
<rect x="40" y="110" width="120" height="4" rx="2" fill="url(#gold)"/>
<text x="40" y="142" fill="#7FC8FF" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Live contribution data for <tspan fill="#F2C76E" font-weight="700">Achal-kashyap</tspan> renders under this mark.</text>

<!-- axis ticks -->
<g stroke="#AEB8D0" stroke-opacity=".25">
  <path d="M40 285H1060" stroke-dasharray="2 6"/>
  <path d="M40 276V294M300 280V290M560 280V290M820 280V290M1060 276V294"/>
</g>

<!-- area under main curve -->
<path d="M40 210 C 180 120, 280 250, 460 190 S 760 120, 1060 150 L1060 285 L40 285 Z" fill="url(#area)"/>

<!-- curves -->
<path class="flow" d="M40 210 C 180 120, 280 250, 460 190 S 760 120, 1060 150" stroke="#7FC8FF" stroke-width="2.2"/>
<path class="flow-slow" d="M40 250 C 220 180, 340 300, 540 230 S 820 300, 1060 200" stroke="#F2C76E" stroke-width="2"/>
<path d="M40 180 C 200 240, 400 140, 640 210 S 900 260, 1060 170" stroke="#8E9BFF" stroke-width="1.6" opacity=".55"/>

<!-- milestone nodes -->
<circle class="node" cx="460" cy="190" r="5" fill="#0A111F" stroke="#F2C76E" stroke-width="2"/>
<circle class="node" style="animation-delay:-1s" cx="760" cy="140" r="5" fill="#0A111F" stroke="#7FC8FF" stroke-width="2"/>
<circle class="node" style="animation-delay:-2s" cx="1060" cy="150" r="5" fill="#0A111F" stroke="#9BE7C4" stroke-width="2"/>
<text x="460" y="172" text-anchor="middle" fill="#AEB8D0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">START</text>
<text x="760" y="122" text-anchor="middle" fill="#AEB8D0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">BUILD</text>
<text x="1040" y="132" text-anchor="end" fill="#9BE7C4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">NOW</text>

<!-- travelers -->
<circle class="traveler" r="6" fill="#FFE3A3" filter="url(#soft)"/>
<circle class="traveler-b" r="4.5" fill="#7FC8FF" filter="url(#soft)"/>

<!-- pills -->
<rect class="pill" x="48" y="308" width="150" height="38" rx="10" fill="#0E1730" stroke="#F2C76E" stroke-width="1.3"/>
<text x="123" y="332" text-anchor="middle" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Consistency</text>
<rect class="pill" style="animation-delay:-.9s" x="214" y="308" width="120" height="38" rx="10" fill="#0E1730" stroke="#7FC8FF" stroke-width="1.3"/>
<text x="274" y="332" text-anchor="middle" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Activity</text>
<rect class="pill" style="animation-delay:-1.8s" x="350" y="308" width="118" height="38" rx="10" fill="#0E1730" stroke="#F2C76E" stroke-width="1.3"/>
<text x="409" y="332" text-anchor="middle" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Growth</text>
<rect class="pill" style="animation-delay:-2.7s" x="484" y="308" width="124" height="38" rx="10" fill="#0E1730" stroke="#7FC8FF" stroke-width="1.3"/>
<text x="546" y="332" text-anchor="middle" fill="#F4F1EA" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Progress</text>
<text x="1060" y="332" text-anchor="end" fill="#AEB8D0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">KEEP SHIPPING</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
